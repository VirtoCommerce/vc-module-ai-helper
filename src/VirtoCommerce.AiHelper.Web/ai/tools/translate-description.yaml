name: aihelper_translate_description
description: |
  Translate text content to a target language using AI translation service.
  Supports product descriptions, names, and any text content.
  Use ISO 639-1 language codes (en, de, fr, es, it, ru, zh, ja, etc.).
  Returns the translated text preserving formatting and structure.

parameters:
  type: object
  properties:
    text:
      type: string
      description: The text content to translate
    targetLanguage:
      type: string
      description: Target language code (ISO 639-1, e.g., 'en', 'de', 'fr', 'es')
    userId:
      type: string
      description: User ID for audit purposes (optional)
    entityId:
      type: string
      description: Related entity ID (e.g., product ID) for tracking (optional)
    entityType:
      type: string
      description: Type of entity being translated (e.g., 'Product', 'Category') (optional)
  required:
    - text
    - targetLanguage

execution:
  endpoint: /api/aihelper/translate
  method: POST
  requestMapping:
    text: "{{text}}"
    targetLanguage: "{{targetLanguage}}"
    userId: "{{userId}}"
    entityId: "{{entityId}}"
    entityType: "{{entityType}}"
  responseMapping:
    result: "$.result"
    success: "$.success"
    errorMessage: "$.errorMessage"

permission:
  - ai-helper:read

tags:
  - aihelper
  - translation
  - content
  - write
