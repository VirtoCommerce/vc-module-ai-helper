name: aihelper_get_product
description: |
  Get detailed information about a specific seller product by ID.
  Returns full product data including name, description, category, images, and metadata.
  Use this tool to retrieve product information before translation or content generation.

parameters:
  type: object
  properties:
    productId:
      type: string
      description: The seller product ID to retrieve
  required:
    - productId

execution:
  endpoint: /api/vcmp/seller/products/{{productId}}
  method: GET
  responseMapping:
    product: "$"

permission:
  - ai-helper:read

tags:
  - aihelper
  - products
  - read
